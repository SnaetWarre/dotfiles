# MangoWC Configuration
# Based on migrated Hyprland config

# Appearance & Theme
gappiv=2
gappih=2
gappov=2
gappoh=2
borderpx=1
border_radius=0
focused_opacity=1.0
unfocused_opacity=1.0

# Colors (Extracted from Pywal/Hyprland fallbacks where applicable)
focuscolor=0xdbb1b3ff
bordercolor=0xf0844fff

# Effects
blur=0
blur_layer=0
shadows=0
layer_shadows=0
animations=0
layer_animations=0

# Environment Variables
env=GTK_THEME,Flat-Remix-GTK-Blue-Darkest
env=XCURSOR_THEME,Adwaita
env=XCURSOR_SIZE,24
env=HYPRCURSOR_THEME,Bibata-Modern-Classic
env=HYPRCURSOR_SIZE,24
env=QT_STYLE_OVERRIDE,kvantum
env=QT_QPA_PLATFORMTHEME,kvantum
env=QT_QUICK_CONTROLS_STYLE,kvantum
env=AQ_FORCE_LINEAR_BLIT,0
env=PIPEWIRE_LATENCY,128/48000
env=PIPEWIRE_QUANTUM,128/48000
env=QT_CURSOR_THEME,Bibata-Modern-Classic
env=QT_CURSOR_SIZE,24
env=XDG_DATA_DIRS,/home/warre/.local/share:/usr/local/share:/usr/share:/opt/t3code-bin/usr/share

# Input & Trackpad
xkb_rules_layout=be
trackpad_natural_scrolling=1
tap_to_click=1
mouse_natural_scrolling=0

# Layout
dwindle_smart_split=0
dwindle_drop_simple_split=1
dwindle_manual_split=0
dwindle_hsplit=1
dwindle_vsplit=1
dwindle_preserve_split=1
tagrule=id:1,layout_name:dwindle
tagrule=id:2,layout_name:dwindle
tagrule=id:3,layout_name:dwindle
tagrule=id:4,layout_name:dwindle
tagrule=id:5,layout_name:dwindle
tagrule=id:6,layout_name:dwindle
tagrule=id:7,layout_name:dwindle
tagrule=id:8,layout_name:dwindle
tagrule=id:9,layout_name:dwindle
tagrule=id:10,layout_name:dwindle

# System Autostarts
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP GTK_THEME QT_QPA_PLATFORMTHEME QT_STYLE_OVERRIDE XCURSOR_THEME XCURSOR_SIZE
exec-once=systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP GTK_THEME QT_QPA_PLATFORMTHEME QT_STYLE_OVERRIDE XCURSOR_THEME XCURSOR_SIZE
exec-once=waybar
exec-once=asusctl -k off
exec-once=awww-daemon
exec-once=~/.config/hypr/scripts/auto-monitor-detect.sh
exec-once=nm-applet --indicator
exec-once=/usr/lib/polkit-gnome-authentication-agent-1
exec-once=mako
exec-once=~/.config/hypr/scripts/battery-notify.sh
exec-once=wl-paste --type text --watch cliphist store
exec-once=wl-paste --type image --watch cliphist store
exec-once=systemctl --user enable --now pipewire pipewire-pulse wireplumber

# Application Shortcuts
bind=SUPER,Return,spawn,kitty
bind=SUPER,code:26,spawn,thunar
bind=SUPER,SPACE,spawn,rofi -show combi -modi drun,run,combi -combi-modi drun,run -combi-hide-mode-prefix true -display-combi "" -theme ~/.config/rofi/config.rasi
bind=SUPER,code:56,spawn,helium-browser

# Window Management Keybinds
bind=SUPER,code:38,killclient
bind=SUPER+SHIFT,code:27,reload_config
bind=SUPER+SHIFT,code:27,spawn,notify-send "MangoWC" "Config reloaded"
bind=SUPER+SHIFT,code:47,spawn,loginctl terminate-user ""
bind=SUPER,code:55,togglefloating,
bind=SUPER+SHIFT,code:41,togglefloating,
bind=SUPER,code:29,toggleglobal,
bind=SUPER,code:41,togglefullscreen,
bind=SUPER,code:43,focusdir,left
bind=SUPER,code:46,focusdir,right
bind=SUPER,code:45,focusdir,up
bind=SUPER,code:44,focusdir,down

# Workspaces / Tags for Belgian AZERTY number row.
bind=SUPER,ampersand,view,1,0
bind=SUPER,eacute,view,2,0
bind=SUPER,quotedbl,view,3,0
bind=SUPER,apostrophe,view,4,0
bind=SUPER,parenleft,view,5,0
bind=SUPER,section,view,6,0
bind=SUPER,egrave,view,7,0
bind=SUPER,exclam,view,8,0
bind=SUPER,ccedilla,view,9,0
bind=SUPER,agrave,view,10,0
bind=SUPER,Left,viewtoleft,0
bind=SUPER,Right,viewtoright,0

# Move window silently to tag.
bind=SUPER+SHIFT,ampersand,tagsilent,1
bind=SUPER+SHIFT,1,tagsilent,1
bind=SUPER+SHIFT,eacute,tagsilent,2
bind=SUPER+SHIFT,2,tagsilent,2
bind=SUPER+SHIFT,quotedbl,tagsilent,3
bind=SUPER+SHIFT,3,tagsilent,3
bind=SUPER+SHIFT,apostrophe,tagsilent,4
bind=SUPER+SHIFT,4,tagsilent,4
bind=SUPER+SHIFT,parenleft,tagsilent,5
bind=SUPER+SHIFT,5,tagsilent,5
bind=SUPER+SHIFT,section,tagsilent,6
bind=SUPER+SHIFT,6,tagsilent,6
bind=SUPER+SHIFT,egrave,tagsilent,7
bind=SUPER+SHIFT,7,tagsilent,7
bind=SUPER+SHIFT,exclam,tagsilent,8
bind=SUPER+SHIFT,8,tagsilent,8
bind=SUPER+SHIFT,ccedilla,tagsilent,9
bind=SUPER+SHIFT,9,tagsilent,9
bind=SUPER+SHIFT,agrave,tagsilent,10
bind=SUPER+SHIFT,0,tagsilent,10

# Move window to tag and view tag.
bind=SUPER+CTRL,ampersand,tag,1,0
bind=SUPER+CTRL,ampersand,view,1,0
bind=SUPER+CTRL,eacute,tag,2,0
bind=SUPER+CTRL,eacute,view,2,0
bind=SUPER+CTRL,quotedbl,tag,3,0
bind=SUPER+CTRL,quotedbl,view,3,0
bind=SUPER+CTRL,apostrophe,tag,4,0
bind=SUPER+CTRL,apostrophe,view,4,0
bind=SUPER+CTRL,parenleft,tag,5,0
bind=SUPER+CTRL,parenleft,view,5,0
bind=SUPER+CTRL,section,tag,6,0
bind=SUPER+CTRL,section,view,6,0
bind=SUPER+CTRL,egrave,tag,7,0
bind=SUPER+CTRL,egrave,view,7,0
bind=SUPER+CTRL,exclam,tag,8,0
bind=SUPER+CTRL,exclam,view,8,0
bind=SUPER+CTRL,ccedilla,tag,9,0
bind=SUPER+CTRL,ccedilla,view,9,0
bind=SUPER+CTRL,agrave,tag,10,0
bind=SUPER+CTRL,agrave,view,10,0
bind=SUPER+CTRL,Left,tagtoleft,0
bind=SUPER+CTRL,Right,tagtoright,0

# Mouse Bindings for move/resize
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# Media & Volume (spawn_shell for &&)
binds=NONE,XF86AudioRaiseVolume,spawn,~/.config/quickshell/scripts/osd-volume-up.sh
binds=NONE,XF86AudioLowerVolume,spawn,~/.config/quickshell/scripts/osd-volume-down.sh
binds=NONE,XF86AudioMute,spawn,~/.config/quickshell/scripts/osd-volume-mute.sh
binds=NONE,XF86AudioPlay,spawn,playerctl play-pause
binds=NONE,XF86AudioNext,spawn,playerctl next
binds=NONE,XF86AudioPrev,spawn,playerctl previous

# Brightness
binds=NONE,XF86MonBrightnessUp,spawn,~/.config/quickshell/scripts/osd-brightness-up.sh
binds=NONE,XF86MonBrightnessDown,spawn,~/.config/quickshell/scripts/osd-brightness-down.sh
bind=NONE,F7,spawn,~/.config/quickshell/scripts/osd-brightness-down.sh
bind=NONE,F8,spawn,~/.config/quickshell/scripts/osd-brightness-up.sh

# Misc Shortcuts
bind=SUPER+SHIFT,code:26,spawn,~/.config/hypr/scripts/emoji_picker
bind=SUPER+SHIFT,code:32,spawn,swaylock-fancy -e -K -p 10
bind=SUPER,code:40,spawn,~/.config/waybar/scripts/touchpad-toggle.sh
bind=SUPER,code:52,spawn,~/.config/hypr/scripts/wallpaper.sh
bind=SUPER+SHIFT,code:52,spawn,~/.config/hypr/scripts/wallpaper-select.sh
bind=SUPER+SHIFT,code:28,spawn,~/.config/hypr/scripts/theme-select.sh
bind=SUPER,code:42,spawn,~/.config/hypr/scripts/gamemode.sh
bind=SUPER+SHIFT+CTRL,code:24,spawn,~/.config/hypr/scripts/autoclicker.py toggle
bind=SUPER,code:30,spawn,~/.config/waybar/waybar.sh
bind=SUPER,code:54,spawn,~/.config/hypr/scripts/clipboard-history.sh
bind=SUPER,code:57,spawn,~/.config/mako/toggle-dnd.sh

# Screenshots (from Hyprland)
bind=SUPER+SHIFT,code:39,spawn,~/.config/hypr/scripts/screenshot_full
bind=SUPER,code:24,spawn,grim -g "$(slurp)" - | swappy -f -
bind=SUPER,code:25,spawn,grim -g "$(slurp)" - | wl-copy

# Window Rules
windowrule=appid:rofi,isfloating:1
windowrule=appid:org.pulseaudio.pavucontrol,isfloating:1
windowrule=appid:blueman-manager,isfloating:1
windowrule=appid:xdg-desktop-portal-gtk,isfloating:1
windowrule=appid:xdg-desktop-portal-kde,isfloating:1
windowrule=appid:xdg-desktop-portal-hyprland,isfloating:1
windowrule=appid:polkit-gnome-authentication-agent-1,isfloating:1
windowrule=appid:hyprpolkitagent,isfloating:1
windowrule=appid:CachyOSHello,isfloating:1
windowrule=appid:zenity,isfloating:1
windowrule=appid:gnome-calculator,isfloating:1
windowrule=appid:Gnome-calculator,isfloating:1
windowrule=title:Picture in picture,isfloating:1
windowrule=title:Picture-in-Picture,isfloating:1
windowrule=title:Steam - Self Updater,isfloating:1
windowrule=appid:mpv,isfloating:1
windowrule=appid:imv,isfloating:1
windowrule=appid:thunar,focused_opacity:0.80,unfocused_opacity:0.80
windowrule=appid:Thunar,focused_opacity:0.80,unfocused_opacity:0.80
windowrule=appid:org.mozilla.firefox,noblur:1
windowrule=appid:kitty,noblur:1
