# MangoWC Configuration
# Based on migrated Hyprland config

# Appearance & Theme
gappiv=5
gappih=5
gappov=5
gappoh=5
borderpx=1
border_radius=0
focused_opacity=1.0
unfocused_opacity=1.0

# Colors (Extracted from Pywal/Hyprland fallbacks where applicable)
focuscolor=0x969696ff
bordercolor=0x494949ff

# Effects
blur=1
shadows=1

# Environment Variables
env=GTK_THEME,Flat-Remix-GTK-Blue-Darkest
env=XCURSOR_THEME,Adwaita
env=XCURSOR_SIZE,24
env=HYPRCURSOR_THEME,Bibata-Modern-Classic
env=HYPRCURSOR_SIZE,24
env=QT_STYLE_OVERRIDE,kvantum
env=QT_QPA_PLATFORMTHEME,kvantum
env=QT_QUICK_CONTROLS_STYLE,kvantum
env=AQ_FORCE_LINEAR_BLIT,0
env=PIPEWIRE_LATENCY,128/48000
env=PIPEWIRE_QUANTUM,128/48000
env=QT_CURSOR_THEME,Bibata-Modern-Classic
env=QT_CURSOR_SIZE,24
env=XDG_DATA_DIRS,/home/warre/.local/share:/usr/local/share:/usr/share:/opt/t3code-bin/usr/share

# Input & Trackpad
xkb_rules_layout=be
trackpad_natural_scrolling=1
tap_to_click=1
mouse_natural_scrolling=0

# System Autostarts
exec-once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP GTK_THEME QT_QPA_PLATFORMTHEME QT_STYLE_OVERRIDE XCURSOR_THEME XCURSOR_SIZE
exec-once=systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP GTK_THEME QT_QPA_PLATFORMTHEME QT_STYLE_OVERRIDE XCURSOR_THEME XCURSOR_SIZE
exec-once=waybar
exec-once=asusctl -k off
exec-once=awww-daemon
exec-once=~/.config/hypr/scripts/auto-monitor-detect.sh
exec-once=nm-applet --indicator
exec-once=/usr/lib/polkit-gnome-authentication-agent-1
exec-once=GDK_BACKEND=wayland swaync
exec-once=~/.config/hypr/scripts/battery-notify.sh
exec-once=swaync
exec-once=wl-paste --type text --watch cliphist store
exec-once=wl-paste --type image --watch cliphist store
exec-once=systemctl --user enable --now pipewire pipewire-pulse wireplumber

# Application Shortcuts
bind=SUPER,Return,spawn,kitty
bind=SUPER,e,spawn,thunar
bind=SUPER,SPACE,spawn,rofi -show combi -modi drun,run,combi -combi-modi drun,run -combi-hide-mode-prefix true -display-combi "" -theme ~/.config/rofi/config.rasi
bind=SUPER,b,spawn,helium-browser

# Window Management Keybinds
bind=SUPER,q,killclient
bind=SUPER+SHIFT,r,reload_config
bind=SUPER+SHIFT,r,spawn,notify-send "MangoWC" "Config reloaded"
bind=SUPER+SHIFT,m,spawn,loginctl terminate-user ""
bind=SUPER,v,togglefloating,
bind=SUPER+SHIFT,f,togglefloating,
bind=SUPER,y,toggleglobal,
bind=SUPER,f,togglefullscreen,
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down

# Workspaces / Tags (use physical number row via keycodes for AZERTY/QWERTY consistency)
bind=SUPER,code:10,spawn,~/.config/mango/scripts/workspace.sh 1
bind=SUPER,code:11,spawn,~/.config/mango/scripts/workspace.sh 2
bind=SUPER,code:12,spawn,~/.config/mango/scripts/workspace.sh 3
bind=SUPER,code:13,spawn,~/.config/mango/scripts/workspace.sh 4
bind=SUPER,code:14,spawn,~/.config/mango/scripts/workspace.sh 5
bind=SUPER,code:15,spawn,~/.config/mango/scripts/workspace.sh 6
bind=SUPER,code:16,spawn,~/.config/mango/scripts/workspace.sh 7
bind=SUPER,code:17,spawn,~/.config/mango/scripts/workspace.sh 8
bind=SUPER,code:18,spawn,~/.config/mango/scripts/workspace.sh 9
bind=SUPER,code:19,spawn,~/.config/mango/scripts/workspace.sh 10

# Move window silently to tag
bind=SUPER+SHIFT,code:10,tagsilent,1
bind=SUPER+SHIFT,code:11,tagsilent,2
bind=SUPER+SHIFT,code:12,tagsilent,3
bind=SUPER+SHIFT,code:13,tagsilent,4
bind=SUPER+SHIFT,code:14,tagsilent,5
bind=SUPER+SHIFT,code:15,tagsilent,6
bind=SUPER+SHIFT,code:16,tagsilent,7
bind=SUPER+SHIFT,code:17,tagsilent,8
bind=SUPER+SHIFT,code:18,tagsilent,9
bind=SUPER+SHIFT,code:19,tagsilent,10


# Move window to tag and view tag
bind=SUPER+CTRL,code:10,tag,1,0
bind=SUPER+CTRL,code:10,view,1,0
bind=SUPER+CTRL,code:11,tag,2,0
bind=SUPER+CTRL,code:11,view,2,0
bind=SUPER+CTRL,code:12,tag,3,0
bind=SUPER+CTRL,code:12,view,3,0
bind=SUPER+CTRL,code:13,tag,4,0
bind=SUPER+CTRL,code:13,view,4,0
bind=SUPER+CTRL,code:14,tag,5,0
bind=SUPER+CTRL,code:14,view,5,0
bind=SUPER+CTRL,code:15,tag,6,0
bind=SUPER+CTRL,code:15,view,6,0
bind=SUPER+CTRL,code:16,tag,7,0
bind=SUPER+CTRL,code:16,view,7,0
bind=SUPER+CTRL,code:17,tag,8,0
bind=SUPER+CTRL,code:17,view,8,0
bind=SUPER+CTRL,code:18,tag,9,0
bind=SUPER+CTRL,code:18,view,9,0
bind=SUPER+CTRL,code:19,tag,10,0
bind=SUPER+CTRL,code:19,view,10,0
bind=SUPER+CTRL,code:19,tag,0,0
bind=SUPER+CTRL,code:19,view,0,0

# Mouse Bindings for move/resize
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# Media & Volume (spawn_shell for &&)
binds=NONE,XF86AudioRaiseVolume,spawn,~/.config/quickshell/scripts/osd-volume-up.sh
binds=NONE,XF86AudioLowerVolume,spawn,~/.config/quickshell/scripts/osd-volume-down.sh
binds=NONE,XF86AudioMute,spawn,~/.config/quickshell/scripts/osd-volume-mute.sh
binds=NONE,XF86AudioPlay,spawn,playerctl play-pause
binds=NONE,XF86AudioNext,spawn,playerctl next
binds=NONE,XF86AudioPrev,spawn,playerctl previous

# Brightness
binds=NONE,XF86MonBrightnessUp,spawn,~/.config/quickshell/scripts/osd-brightness-up.sh
binds=NONE,XF86MonBrightnessDown,spawn,~/.config/quickshell/scripts/osd-brightness-down.sh
bind=NONE,F7,spawn,~/.config/quickshell/scripts/osd-brightness-down.sh
bind=NONE,F8,spawn,~/.config/quickshell/scripts/osd-brightness-up.sh

# Misc Shortcuts
bind=SUPER+SHIFT,e,spawn,~/.config/hypr/scripts/emoji_picker
bind=SUPER+SHIFT,o,spawn,swaylock-fancy -e -K -p 10
bind=SUPER,d,spawn,~/.config/waybar/scripts/touchpad-toggle.sh
bind=SUPER,w,spawn,~/.config/hypr/scripts/wallpaper.sh
bind=SUPER+SHIFT,w,spawn,~/.config/hypr/scripts/wallpaper-select.sh
bind=SUPER+SHIFT,t,spawn,~/.config/hypr/scripts/theme-select.sh
bind=SUPER,g,spawn,~/.config/hypr/scripts/gamemode.sh
bind=SUPER+SHIFT+CTRL,a,spawn,~/.config/hypr/scripts/autoclicker.py toggle
bind=SUPER,u,spawn,~/.config/waybar/waybar.sh
bind=SUPER,c,spawn,bash -c "cliphist list | tofi --config ~/.config/hypr/tofi-dmenu.conf | cliphist decode | wl-copy"
bind=SUPER,n,spawn,swaync-client -t -sw

# Screenshots (from Hyprland)
bind=SUPER+SHIFT,s,spawn,~/.config/hypr/scripts/screenshot_full
bind=SUPER,a,spawn,grim -g "$(slurp)" - | swappy -f -
bind=SUPER,z,spawn,grim -g "$(slurp)" - | wl-copy

# Window Rules
windowrule=appid:rofi,isfloating:1
windowrule=appid:org.pulseaudio.pavucontrol,isfloating:1
windowrule=appid:blueman-manager,isfloating:1
windowrule=appid:xdg-desktop-portal-gtk,isfloating:1
windowrule=appid:xdg-desktop-portal-kde,isfloating:1
windowrule=appid:xdg-desktop-portal-hyprland,isfloating:1
windowrule=appid:polkit-gnome-authentication-agent-1,isfloating:1
windowrule=appid:hyprpolkitagent,isfloating:1
windowrule=appid:CachyOSHello,isfloating:1
windowrule=appid:zenity,isfloating:1
windowrule=appid:gnome-calculator,isfloating:1
windowrule=appid:Gnome-calculator,isfloating:1
windowrule=title:Picture in picture,isfloating:1
windowrule=title:Picture-in-Picture,isfloating:1
windowrule=title:Steam - Self Updater,isfloating:1
windowrule=appid:mpv,isfloating:1
windowrule=appid:imv,isfloating:1
windowrule=appid:thunar,focused_opacity:0.80,unfocused_opacity:0.80
windowrule=appid:Thunar,focused_opacity:0.80,unfocused_opacity:0.80
windowrule=appid:org.mozilla.firefox,noblur:1
windowrule=appid:kitty,noblur:1
