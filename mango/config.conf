# MangoWM config mirrored from ~/.config/hypr/hyprland.lua.
# Keep the two in sync: section order follows hyprland.lua.
# Validate with: mango -p -c ~/.config/mango/config.conf

var=filemanager,dolphin --platformtheme qt6ct
var=terminal,kitty
var=browser,helium-browser
var=scripts,~/.config/hypr/scripts
var=mscripts,~/.config/mango/scripts

# Monitors
monitor_rule=name:^eDP-1$,width:2560,height:1440,refresh:165,x:0,y:0,scale:1,vrr:0

# Environment
env=XDG_CURRENT_DESKTOP,mango
env=XDG_SESSION_DESKTOP,mango
env=DESKTOP_SESSION,mango
env=KDE_FULL_SESSION,false
env=GTK_THEME,Flat-Remix-GTK-Blue-Darkest
env=XCURSOR_THEME,Adwaita
env=XCURSOR_SIZE,24
env=HYPRCURSOR_THEME,Bibata-Modern-Classic
env=HYPRCURSOR_SIZE,24
env=QT_STYLE_OVERRIDE,kvantum
env=QT_QPA_PLATFORMTHEME,kvantum
env=QT_QUICK_CONTROLS_STYLE,kvantum
env=AQ_FORCE_LINEAR_BLIT,0
env=PIPEWIRE_LATENCY,128/48000
env=PIPEWIRE_QUANTUM,128/48000
env=QT_CURSOR_THEME,Bibata-Modern-Classic
env=QT_CURSOR_SIZE,24
env=XDG_DATA_DIRS,/home/warre/.local/share:/usr/local/share:/usr/share:/opt/t3code-bin/usr/share

# Autostart
# Same session bootstrap as Hyprland, with mango-session.target in place of
# hyprland-session.target. The polkit agent runs as a systemd user service.
exec_once=$mscripts/session-start.sh
exec_once=asusctl leds set off
exec_once=awww-daemon
exec_once=nm-applet --indicator
exec_once=blueman-applet
exec_once=udiskie --tray
exec_once=systemctl --user start mako.service
exec_once=$scripts/battery-notify.sh
exec_once=wl-paste --type text --watch cliphist store
exec_once=wl-paste --type image --watch cliphist store
exec_once=systemctl --user enable --now pipewire pipewire-pulse wireplumber

# General
allow_tearing=0
gap_inner_horizontal=2
gap_inner_vertical=2
gap_outer_horizontal=2
gap_outer_vertical=2
border_px=1
# color7 at 0x66 / 0x22 alpha. apply_wal_outputs.sh rewrites these two lines.
focus_color=0xd1bec066
border_color=0xd1bec022
enable_border_resize=1
enable_floating_snap=1
snap_distance=1
tag_rule=id:*,layout_name:dwindle
# persistent-workspaces "*": 5 in the Waybar config
tag_rule=id:1,layout_name:dwindle,no_hide:1
tag_rule=id:2,layout_name:dwindle,no_hide:1
tag_rule=id:3,layout_name:dwindle,no_hide:1
tag_rule=id:4,layout_name:dwindle,no_hide:1
tag_rule=id:5,layout_name:dwindle,no_hide:1

# Decoration
focused_opacity=1.0
unfocused_opacity=1.0
border_radius=10
dim_enable=0
blur=0
blur_layer=0
blur_optimized=1
blur_params_radius=5
blur_params_num_passes=2
blur_params_noise=0.02
blur_params_brightness=0.9
blur_params_contrast=0.9
shadows=1
layer_shadows=0
shadow_only_floating=0
shadows_size=28
shadows_blur=15
shadows_position_x=0
shadows_position_y=6
shadows_color=0x00000070

# Animations (Hyprland speed is in tenths of a second: 0.9 -> 90ms)
animations=1
layer_animations=1
animation_type_open=zoom
animation_type_close=slide
layer_animation_type_open=fade
layer_animation_type_close=fade
animation_fade_in=1
animation_fade_out=1
fade_in_begin_opacity=0.0
fade_out_begin_opacity=1.0
zoom_initial_ratio=0.7
tag_animation_direction=1
animation_duration_open=90
animation_duration_close=300
animation_duration_move=90
animation_duration_tag=25
animation_duration_focus=90
animation_curve_open=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opacity_fade_in=0.46,1.0,0.29,1
animation_curve_opacity_fade_out=0.25,0,0.5,1

# Input
xkb_rules_layout=be,us
xkb_rules_options=caps:escape
sloppy_focus=1
warp_cursor=1
mouse_accel_profile=2
mouse_accel_speed=0
mouse_natural_scrolling=0
trackpad_natural_scrolling=1
trackpad_scroll_factor=0.8
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_click_method=2
button_map=0
trackpad_disable_while_typing=1

# Gestures
gesture_live=1
gesture_swipe_distance=250
gesture_swipe_min_speed_to_force=15
gesture_swipe_cancel_ratio=0.5
gesturebind=none,left,4,viewnext_have_client
gesturebind=none,right,4,viewprev_have_client

# Group
group_bar_height=10
group_bar_decorate_font_desc=Bitstream Vera Sans Mono 9
group_bar_decorate_fg_color=0x00000000
group_bar_decorate_focus_fg_color=0x00000000
group_bar_decorate_bg_color=0x77770066
group_bar_decorate_focus_bg_color=0xffff0066
group_bar_decorate_border_width=0
group_bar_decorate_corner_radius=1

# Misc
focus_on_activate=0
drag_tile_to_tile=1
no_border_when_single=0
smart_gaps=0

# Binds
view_current_to_back=1
focus_cross_monitor=1
exchange_cross_monitor=1
tag_num=10

# Cursor
cursor_theme=Bibata-Modern-Classic
cursor_size=24

# Xwayland
xwayland_ignore_scale=0

# Dwindle (force_split=0: new window goes to the cursor side)
dwindle_horizontal_split=0
dwindle_vertical_split=0
dwindle_split_ratio=0.5
dwindle_preserve_split=1

# Master
new_is_master=1

# Special workspaces: special_scale_factor 0.8 means 10% margin per side
special_dim=0.2
special_gap_inner_horizontal=2
special_gap_inner_vertical=2
special_gap_outer_horizontal=256
special_gap_outer_vertical=144
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.8

# Input devices
device_rule=name:ASUE120A:00 04F3:319B Touchpad,accel_speed:0.15,accel_profile:2
device_rule=name:Logitech PRO 2 MOUSE,accel_speed:0,accel_profile:1

# Keybindings
key_mode=default
bind=SUPER+SHIFT,S,spawn,$mscripts/screenshot_full
bind=SUPER,Return,spawn,$terminal
bind=SUPER,E,spawn,$filemanager
bind=SUPER+SHIFT,E,spawn,$scripts/emoji_picker
bind=SUPER,A,spawn_shell,grim -g "$(slurp)" - | swappy -f -
bind=SUPER,Z,spawn_shell,grim -g "$(slurp)" - | wl-copy
bind=SUPER,Q,killclient
bind=SUPER+SHIFT,M,spawn_shell,loginctl terminate-user ""
bind=SUPER,V,togglefloating
bind=SUPER,space,spawn,rofi -show combi -modi drun,run,combi -combi-modi drun,run -combi-hide-mode-prefix true -display-combi "" -theme ~/.config/rofi/config.rasi
bind=SUPER,F,togglefullscreen
bind=SUPER,Y,toggleglobal
bind=SUPER,Tab,groupfocus,next
# Replaces hyprshell's Alt+Tab switcher (switch_workspaces: true)
bind=ALT,Tab,switcher,all_tag_next
bind=ALT+SHIFT,Tab,switcher,all_tag_prev

bindl=NONE,XF86AudioRaiseVolume,spawn,~/.config/quickshell/scripts/osd-volume-up.sh
bindl=NONE,XF86AudioLowerVolume,spawn,~/.config/quickshell/scripts/osd-volume-down.sh
bindl=NONE,XF86AudioMute,spawn,~/.config/quickshell/scripts/osd-volume-mute.sh
bindl=NONE,XF86AudioMicMute,spawn,$scripts/toggle-microphone.sh
bind=NONE,XF86AudioPlay,spawn,playerctl play-pause
bind=NONE,XF86AudioNext,spawn,playerctl next
bind=NONE,XF86AudioPrev,spawn,playerctl previous
bind=NONE,XF86MonBrightnessUp,spawn,~/.config/quickshell/scripts/osd-brightness-up.sh
bind=NONE,XF86MonBrightnessDown,spawn,~/.config/quickshell/scripts/osd-brightness-down.sh
bind=NONE,XF86KbdBrightnessUp,spawn,asusctl leds next
bind=NONE,XF86KbdBrightnessDown,spawn,asusctl leds prev
bind=NONE,XF86Launch4,spawn,$scripts/cycle-aura-effect.sh
bind=NONE,XF86Fn_F5,spawn,$scripts/cycle-asus-profile.sh
bind=NONE,XF86Phone,spawn,$scripts/cycle-asus-profile.sh
bind=NONE,Print,spawn,$mscripts/screenshot_full
bind=NONE,XF86TouchpadToggle,spawn,~/.config/waybar/scripts/touchpad-toggle.sh
bindl=NONE,XF86Sleep,spawn,systemctl suspend
bindl=NONE,XF86RFKill,spawn,$scripts/notify-airplane-mode.sh
bind=NONE,XF86Launch3,spawn,rog-control-center
bind=NONE,F7,spawn,~/.config/quickshell/scripts/osd-brightness-down.sh
bind=NONE,F8,spawn,~/.config/quickshell/scripts/osd-brightness-up.sh
bind=SUPER+SHIFT,O,spawn,swaylock --config ~/.config/swaylock/config
bind=SUPER,D,spawn,~/.config/waybar/scripts/touchpad-toggle.sh

mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down
bind=SUPER,H,focusdir,left
bind=SUPER,L,focusdir,right
bind=SUPER,K,focusdir,up
bind=SUPER,J,focusdir,down
bind=SUPER+SHIFT,Left,move_client,left
bind=SUPER+SHIFT,Right,move_client,right
bind=SUPER+SHIFT,Up,move_client,up
bind=SUPER+SHIFT,Down,move_client,down
bind=SUPER+SHIFT,H,move_client,left
bind=SUPER+SHIFT,L,move_client,right
bind=SUPER+SHIFT,K,move_client,up
bind=SUPER+SHIFT,J,move_client,down

bind=SUPER,R,setkeymode,resize

bind=SUPER+CTRL+SHIFT,Right,resizewin,+15,+0
bind=SUPER+CTRL+SHIFT,Left,resizewin,-15,+0
bind=SUPER+CTRL+SHIFT,Up,resizewin,+0,-15
bind=SUPER+CTRL+SHIFT,Down,resizewin,+0,+15
bind=SUPER+CTRL+SHIFT,L,resizewin,+15,+0
bind=SUPER+CTRL+SHIFT,H,resizewin,-15,+0
bind=SUPER+CTRL+SHIFT,K,resizewin,+0,-15
bind=SUPER+CTRL+SHIFT,J,resizewin,+0,+15

bind=SUPER+ALT,L,resizewin,+15,+0
bind=SUPER+ALT,H,resizewin,-15,+0
bind=SUPER+ALT,K,resizewin,+0,-15
bind=SUPER+ALT,J,resizewin,+0,+15

# Workspaces on the Belgian AZERTY number row (code:13 is the 4 key)
bind=SUPER+CTRL,ampersand,tag,1,0
bind=SUPER+SHIFT,ampersand,tagsilent,1
bind=SUPER,ampersand,view,1,0
bind=SUPER+CTRL,eacute,tag,2,0
bind=SUPER+SHIFT,eacute,tagsilent,2
bind=SUPER,eacute,view,2,0
bind=SUPER+CTRL,quotedbl,tag,3,0
bind=SUPER+SHIFT,quotedbl,tagsilent,3
bind=SUPER,quotedbl,view,3,0
bind=SUPER+CTRL,code:13,tag,4,0
bind=SUPER+SHIFT,code:13,tagsilent,4
bind=SUPER,code:13,view,4,0
bind=SUPER+CTRL,parenleft,tag,5,0
bind=SUPER+SHIFT,parenleft,tagsilent,5
bind=SUPER,parenleft,view,5,0
bind=SUPER+CTRL,section,tag,6,0
bind=SUPER+SHIFT,section,tagsilent,6
bind=SUPER,section,view,6,0
bind=SUPER+CTRL,egrave,tag,7,0
bind=SUPER+SHIFT,egrave,tagsilent,7
bind=SUPER,egrave,view,7,0
bind=SUPER+CTRL,exclam,tag,8,0
bind=SUPER+SHIFT,exclam,tagsilent,8
bind=SUPER,exclam,view,8,0
bind=SUPER+CTRL,ccedilla,tag,9,0
bind=SUPER+SHIFT,ccedilla,tagsilent,9
bind=SUPER,ccedilla,view,9,0
bind=SUPER+CTRL,agrave,tag,10,0
bind=SUPER+SHIFT,agrave,tagsilent,10
bind=SUPER,agrave,view,10,0

bind=SUPER,period,viewtoright_have_client,0
bind=SUPER,comma,viewtoleft_have_client,0
axisbind=SUPER,DOWN,viewtoright_have_client,0
axisbind=SUPER,UP,viewtoleft_have_client,0
bind=SUPER,slash,view,-1,0
# special workspace -> tag 0, special:scratchpad -> the scratchpad pool
bind=SUPER,minus,tag_special_tag
bind=SUPER,equal,toggle_special_tag
bind=SUPER,F1,toggle_scratchpad
bind=SUPER+ALT+SHIFT,F1,minimized

bind=SUPER+SHIFT,F,togglefloating

bind=SUPER,C,spawn,$scripts/clipboard-history.sh
bind=SUPER,N,spawn,~/.config/mako/toggle-dnd.sh
bind=SUPER,W,spawn,$scripts/wallpaper.sh
bind=SUPER+SHIFT,W,spawn,$scripts/wallpaper-select.sh
bind=SUPER,G,spawn,$mscripts/gamemode.sh
bind=SUPER+SHIFT,P,setkeymode,passthrough
bind=SUPER+SHIFT+CTRL,A,spawn,$scripts/autoclicker.py toggle
bind=SUPER,B,spawn,$browser
bind=SUPER,U,spawn,~/.config/waybar/waybar.sh

key_mode=resize
bind=NONE,Right,resizewin,+15,+0
bind=NONE,Left,resizewin,-15,+0
bind=NONE,Up,resizewin,+0,-15
bind=NONE,Down,resizewin,+0,+15
bind=NONE,L,resizewin,+15,+0
bind=NONE,H,resizewin,-15,+0
bind=NONE,K,resizewin,+0,-15
bind=NONE,J,resizewin,+0,+15
bind=NONE,Escape,setkeymode,default

key_mode=passthrough
bind=SUPER+SHIFT,P,setkeymode,default

key_mode=default

# Window rules
window_rule=is_floating:1,app_id:^(Rofi)$
window_rule=is_floating:1,title:^(Picture in picture)$
window_rule=is_floating:1,title:^(Save File)$
window_rule=is_floating:1,title:^(Open File)$
window_rule=is_floating:1,app_id:^(LibreWolf)$,title:^(Picture-in-Picture)$
window_rule=is_floating:1,app_id:^(blueman-manager)$
window_rule=is_floating:1,app_id:^(xdg-desktop-portal-gtk|xdg-desktop-portal-kde|xdg-desktop-portal-hyprland)(.*)$
window_rule=is_floating:1,app_id:^(polkit-gnome-authentication-agent-1|hyprpolkitagent|org.kde.polkit-kde-authentication-agent-1)(.*)$
window_rule=is_floating:1,app_id:^(CachyOSHello)$
window_rule=is_floating:1,app_id:^(zenity)$
window_rule=is_floating:1,title:^(Steam - Self Updater)$
window_rule=is_floating:1,width:960,height:540,title:^(Picture-in-Picture)$
window_rule=is_floating:1,width:960,height:540,title:^(imv|mpv|danmufloat|termfloat|nemo|ncmpcpp)$
window_rule=is_global:1,title:^(danmufloat)$
window_rule=no_blur:1,app_id:^(org.mozilla.firefox)$
window_rule=no_blur:1,app_id:^(Alacritty)$
window_rule=is_floating:1,app_id:^(gnome-calculator|Gnome-calculator)$
window_rule=is_floating:1,app_id:^(mpv|imv)$
window_rule=tags:9,is_open_silent:1,app_id:^(codex-background-test)$
window_rule=focused_opacity:0.80,unfocused_opacity:0.80,app_id:^(thunar|Thunar)$
window_rule=is_floating:0,app_id:^(kitty)$
window_rule=tags:3,is_open_silent:1,app_id:^(legcord)$
# misc:swallow_regex
window_rule=is_term:1,app_id:^(cachy-browser|firefox|nautilus|nemo|thunar|vesktop|btrfs-assistant.)$

# Layer rules
layer_rule=no_animation:1,no_blur:1,layer_name:selection
layer_rule=no_animation:1,no_blur:1,layer_name:waybar
layer_rule=no_animation:1,no_blur:1,layer_name:wallpaper
layer_rule=no_animation:1,no_blur:1,layer_name:rofi
