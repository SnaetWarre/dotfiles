# Mac-only kitty settings. Loaded from kitty.conf through ${KITTY_OS}.conf.

# pywal does not run on the Mac, so use a frozen copy of the current palette.
include macos-colors.conf

# Option types | { [ @ on a Belgian Mac keyboard, so it must stay Option.
macos_option_as_alt no
macos_quit_when_last_window_closed yes
hide_window_decorations titlebar-only
open_url_with default

map cmd+shift+o kitten hints --type url
map alt+backspace send_text all \x17
